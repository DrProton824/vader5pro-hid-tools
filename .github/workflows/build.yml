name: Build Windows Executables
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this build (e.g. 1.2.0)"
        required: true
        default: "0.1.0"
        type: string

      publish:
        description: "Publish GitHub Release"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi Pillow customtkinter
      - name: Build executables
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: python build/build.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaderMapper-v${{ inputs.version }}
          path: dist/VaderMapper/
      - name: Create release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/VaderMapper/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
